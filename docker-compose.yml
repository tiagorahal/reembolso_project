services:
  db:
    image: postgres:15
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reembolso_api_development
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"

  backend:
    build: ./reembolso_api
    depends_on:
      - db
    volumes:
      - ./reembolso_api:/app
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: "postgres://postgres:password@db:5432/reembolso_api_development"
      TZ: America/Sao_Paulo
    command: >
      sh -c "rm -f tmp/pids/server.pid &&
             bundle exec rails db:create db:migrate &&
             bundle exec rails server -b 0.0.0.0"

  frontend:
    build: ./reembolso
    depends_on:
      - backend
    volumes:
      - ./reembolso:/app
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      TZ: America/Sao_Paulo
    command: ["npm", "run", "dev"]

volumes:
  db_data:
